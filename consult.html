<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIZSTACK // CONSULT MATRIX</title>
    <!-- Inject Supabase Client Script -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f6; color: #222; margin: 0; padding: 40px 20px; }
        .container { background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); border: 1px solid #e1e4e6; max-width: 600px; margin: 40px auto; }
        h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; margin-top: 0; margin-bottom: 10px; color: #111; }
        .status { font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; color: #27ae60; text-transform: uppercase; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: #444; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd2d6; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; }
        .btn { display: inline-block; text-align: center; text-decoration: none; color: #fff; background: #222; font-weight: 600; font-size: 0.9rem; padding: 12px 24px; border-radius: 8px; text-transform: uppercase; border: none; cursor: pointer; }
        .btn:hover { background: #000; }
        .btn-secondary { background: none; color: #555; border: 1px solid #cbd2d6; margin-left: 10px; }
        .actions { display: flex; align-items: center; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>REQUEST CONSULT MATRIX</h1>
        <div id="consult-status" class="status">● STATUS: AWAITING SELECTION PARAMETERS</div>
        
        <form id="intake-form" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="company">Company Name</label>
                <input type="text" id="company" required placeholder="e.g. Acme Corp">
            </div>
            <div class="form-group">
                <label for="size">Organizational Footprint</label>
                <select id="size">
                    <option value="1-50">1-50 employees</option>
                    <option value="51-500">51-500 employees</option>
                    <option value="501+">501+ Enterprise Level</option>
                </select>
            </div>
            <div class="form-group">
                <label for="focus">Primary Cost-Reduction Focus</label>
                <select id="focus">
                    <option value="Corporate Benefit Stack Leakage">Corporate Benefit Stack Leakage</option>
                    <option value="Baseline Vendor Contracts Optimization">Baseline Vendor Contracts Optimization</option>
                    <option value="Tax-Advantaged Spending Structuring">Tax-Advantaged Spending Structuring</option>
                </select>
            </div>
            <div class="form-group">
                <label for="notes">Additional Metrics or Constraints</label>
                <textarea id="notes" rows="4" placeholder="List complexities..."></textarea>
            </div>
            <div class="actions">
                <button type="submit" class="btn">Generate Matrix</button>
                <a href="index.html" class="btn btn-secondary">← RETURN TO HUB</a>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tcWpocnJvbGVrcXJmYnlrb2dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA5NzYyMTMsImV4cCI6MjA1NjU1MjIxM30.7jJm7qYxVqVz8R_Z6f-O9vFzWlQxO6G1mZ8W4z2v3bY";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleSubmit(e) {
            e.preventDefault();
            const statusText = document.getElementById('consult-status');
            statusText.innerText = '● STATUS: WRITING TO CLOUD INFRASTRUCTURE...';
            statusText.style.color = '#f39c12';

            const payload = {
                company_name: document.getElementById('company').value,
                footprint_size: document.getElementById('size').value,
                cost_focus: document.getElementById('focus').value,
                additional_notes: document.getElementById('notes').value
            };

            const { error } = await supabase.from('client_intake').insert([payload]);

            if (error) {
                statusText.innerText = '▲ STATUS: DATABASE ERROR CONNECTION';
                statusText.style.color = '#e05353';
                alert('Database Error: ' + error.message);
            } else {
                statusText.innerText = '● STATUS: CONSULT MATRIX LIVE // RECORD PERMANENT';
                statusText.style.color = '#27ae60';
                alert('Your portfolio optimization request has been safely logged in the database.');
                document.getElementById('intake-form').reset();
            }
        }
    </script>
</body>
<script>
document.querySelector('form, div.form-container, [onClick*="matrix"]').addEventListener('click', async function(e) {
    if(e.target.tagName === 'BUTTON' || e.target.innerText.includes('GENERATE')) {
        e.preventDefault();
        
        const companyName = document.querySelector('input[type="text"], #company-name')?.value || 'Test';
        const footprint = document.querySelector('select')?.value || '1-50 employees';
        const constraints = document.querySelector('textarea')?.value || '';

        const statusLabel = document.querySelector('[class*="status"], p, span');
        if(statusLabel) statusLabel.innerHTML = "🟠 STATUS: CONNECTING TO LIVE PROXY TUNNEL...";

        try {
            // Explicitly point to your local machine port via the browser window environment or local address
            const backendHost = "http://127.0.0.1:8080";
            
            const response = await fetch(`${backendHost}/api/consult`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ company: companyName, footprint: footprint, constraints: constraints })
            });
            const data = await response.json();
            if(statusLabel) statusLabel.innerHTML = "🟢 STATUS: SUCCESS! MATRIX GENERATED.";
            alert("Matrix Output Received:\n" + JSON.stringify(data));
        } catch(err) {
            if(statusLabel) statusLabel.innerHTML = "❌ STATUS: CONNECTION TO API FAILED.";
            console.error(err);
        }
    }
});
</script>

</html>
